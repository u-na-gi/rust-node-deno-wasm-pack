name: Publish image to GHCR

# owner が v* タグを push したときだけ動かす。
#   git tag v1.2.3 && git push origin v1.2.3  ->  1.2.3 / latest
# - pull_request / workflow_dispatch は付けない (fork や第三者から起動させない)
# - PAT は使わず、ジョブ限定の GITHUB_TOKEN (packages: write) だけで push する
on:
  push:
    tags:
      - "v*"

# デフォルトの権限を全部落とし、ジョブ側で必要最小限だけ付ける
permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    # タグを push したのが repository owner 本人のときだけ
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, latest
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
